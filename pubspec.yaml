name: urban_resilience
description: "Urban Resilience — prévention et résilience urbaine."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cloud_firestore: ^6.10.0
  dio: ^5.11.1
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.8
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_storage: ^13.6.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.2.1
  latlong2: ^0.9.1
  google_fonts: ^6.3.2
  geocoding: ^4.0.0
  geolocator: ^14.0.3
  go_router: ^18.0.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_map: ^8.2.2
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/brand/app_icon.png
    background_color: "#176B72"
    theme_color: "#176B72"
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#176B72"
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#176B72"
  image: assets/brand/logo-mark.png
  android_12:
    color: "#176B72"
    image: assets/brand/logo-mark.png
  web: true
  ios: true
  android: true

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/brand/
